<!-- Info pane: the permanent right column. Unlike dashboard widgets these are
     page chrome — never hidden or reordered from Customize. Each block is its
     own component; add one by writing components/<name>-panel.html and adding a
     slot below. -->
<aside class="info-pane">
  <div data-component="system-panel"></div>
  <div data-component="weather-panel"></div>
</aside>
