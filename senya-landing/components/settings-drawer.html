<!-- Customize drawer: show/hide and drag-reorder dashboard widgets. Off-canvas
     until the top bar's gear adds body.settings-open — a side drawer on
     desktop, a bottom sheet on mobile (pure CSS). Rows come from
     js/settings.js, driven by js/layout.js. -->
<div id="settings-backdrop" class="settings-backdrop"></div>
<aside id="settings" class="settings-panel" aria-label="Customize layout" aria-hidden="true">
  <div class="settings-head">
    <h2>Customize</h2>
    <button id="settings-close" class="icon-btn" type="button" aria-label="Close">✕</button>
  </div>
  <p class="settings-hint">Drag <span class="set-handle-hint">⠿</span> to reorder · toggle to show/hide. Bookmarks, launchers, System and Weather are fixed page chrome and aren't listed here — everything below is a droppable dashboard widget (add RSS, stocks, etc. by extending js/registry.js).</p>
  <ul id="settings-list" class="settings-list"></ul>
</aside>
