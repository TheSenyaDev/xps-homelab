<!-- Main table: the three columns under the bars. Each column is its own
     component — a data-component slot is replaced by that file's markup, so
     swapping or adding a column is a one-line change here. -->
<main class="main-table">
  <div data-component="launcher-rail"></div>
  <div data-component="dashboard-grid"></div>
  <div data-component="info-pane"></div>
</main>
