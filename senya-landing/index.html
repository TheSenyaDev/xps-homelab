<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Senya</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <!-- The page is a list of sections, top to bottom. Each one's markup lives in
       its own file under /components and is pulled in by js/page.js, which
       replaces the slot below with that file's contents. Reorder the page by
       reordering these lines; add a section by writing
       components/<name>.html and adding a slot for it. -->
  <div data-component="top-bar"></div>
  <div data-component="bookmarks-bar"></div>
  <!-- main-table nests three more components: launcher-rail · dashboard-grid ·
       info-pane (which itself nests system-panel · weather-panel). -->
  <div data-component="main-table"></div>
  <div data-component="settings-drawer"></div>

  <script src="services.js" defer></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
