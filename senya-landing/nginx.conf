# Decide whether the request reached us over an internal network, based on the
# Host header (how the client connected): private LAN ranges, Tailscale CGNAT
# (100.64.0.0/10), or localhost. A public tunnel sends its hostname → not internal.
map $host $internal_client {
    default                                          0;
    localhost                                        1;
    "~^127\."                                        1;
    "~^10\."                                         1;
    "~^192\.168\."                                   1;
    "~^172\.(1[6-9]|2[0-9]|3[01])\."                 1;
    "~^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\." 1;
}

# How long each kind of file may be reused, keyed off the request path.
# Nothing here is content-hashed, so a long max-age on code would strand a
# browser on a stale build after a deploy. Split by how the file behaves:
#
#   icons → effectively immutable. A PNG is replaced by adding a new file, not
#     by editing one, so a month is safe and skips revalidation entirely.
#   everything else (html/js/css/json) → no-cache, meaning "reuse only after
#     asking". Still one conditional request per file, but nginx answers 304
#     with no body, and a stale dashboard is worse than a round trip.
map $uri $cache_control {
    default        "no-cache";
    "~^/icons/"    "public, max-age=2592000";
}

# Small cache for the one upstream we proxy off-box (the finviz market data), so
# an open dashboard refreshing every minute doesn't turn into one request per tab.
# /var/cache/nginx is a tmpfs — nothing is written to the read-only root.
proxy_cache_path /var/cache/nginx/market levels=1:2 keys_zone=market:1m max_size=8m inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so proxy_pass upstreams (e.g. the glances container)
    # are re-resolved at runtime rather than pinned to a stale IP at startup.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Serve UTF-8 so emoji icons in app.js / services.js decode correctly.
    # (With nosniff set, a missing charset makes browsers mis-decode multi-byte
    # emoji as Latin-1 → icons vanish.) Default charset_types covers JS/CSS/HTML.
    charset utf-8;

    # This page contains no secrets and no backend, but we lock it down anyway.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://api.open-meteo.com https://api.coingecko.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Read-only static site: only GET/HEAD make sense.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # ---- transfer size ----
    # The page is ~128KB of text across ~25 small files, which gzips to ~38KB.
    # Off-LAN (Tailscale from another machine) that 70% is the difference
    # between one round trip's worth of data and several.
    # gzip_comp_level 5: past that the CPU cost climbs for ~1% more saving.
    # gzip_min_length skips the tiny component files, where the gzip header
    # would cost more than it saves.
    gzip on;
    gzip_vary on;                 # correct caching for clients that don't accept gzip
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # ---- caching ----
    # Set from the $cache_control map above rather than in per-location blocks:
    # nginx's add_header only inherits when the current level declares *no*
    # add_header of its own, so a Cache-Control inside a location would
    # silently drop the CSP and the other security headers for those files.
    add_header Cache-Control $cache_control always;

    # Internal-only: the list of services + internal IPs. Public/tunnel requests
    # (non-internal Host) get 404, so topology is never disclosed externally.
    location = /services.js {
        if ($internal_client = 0) { return 404; }
        try_files $uri =404;
    }

    # Live system stats: reverse-proxy each host's Glances REST API same-origin
    # so the page can fetch /stats/<host>/<plugin> without CORS and with a tight
    # CSP (connect-src 'self'). Internal-only, like services.js: public/tunnel
    # requests get 404 so host addresses are never exposed externally.
    #
    # XPS power + accurate CPU temp: the power-api reads RAPL watts and the
    # x86_pkg_temp thermal zone (same source Grafana uses), which Glances doesn't
    # expose correctly. Exact-match so it takes priority over the prefix below.
    location = /stats/xps/power {
        if ($internal_client = 0) { return 404; }
        set $power_api "http://power-api:8081";
        rewrite ^.*$ / break;
        proxy_pass $power_api;
    }

    # XPS (this host): the glances container on the shared docker network.
    location /stats/xps/ {
        if ($internal_client = 0) { return 404; }
        set $glances_xps "http://glances:61208";
        rewrite ^/stats/xps/(.*)$ /api/4/$1 break;
        proxy_pass $glances_xps;
    }

    # TrueNAS: install Glances on it (TrueNAS SCALE: add the Glances app, or run
    # `nicolargo/glances -w`) and replace the IP below with your TrueNAS address.
    location /stats/truenas/ {
        if ($internal_client = 0) { return 404; }
        set $glances_truenas "http://192.168.2.82:30015";   # <-- TrueNAS IP:port
        rewrite ^/stats/truenas/(.*)$ /api/4/$1 break;
        proxy_pass $glances_truenas;
    }

    # Fedora PC GPU temp: the box's RTX 2060 is invisible to Glances (the
    # proprietary driver exports no hwmon entry, and the container has no NVML),
    # so this reads the same nvidia-api used on the XPS — running natively there,
    # not in a container. Exact-match so it beats the prefix below, which would
    # otherwise rewrite to Glances' own /api/4/gpu and return an empty list.
    location = /stats/fedora/gpu {
        if ($internal_client = 0) { return 404; }
        set $nvidia_fedora "http://192.168.2.252:8083";   # <-- Fedora IP:port
        rewrite ^.*$ / break;
        proxy_pass $nvidia_fedora;
    }

    # Fedora PC: a rootless-podman Glances on the desktop box (see ../fedora).
    # No power-api entry — that box is a desktop with no battery, and its RAPL
    # counter is root-only, so the card's Temp falls back to the hottest Glances
    # sensor (k10temp) and no CPU Power row is rendered.
    location /stats/fedora/ {
        if ($internal_client = 0) { return 404; }
        set $glances_fedora "http://192.168.2.252:61208";   # <-- Fedora IP:port
        rewrite ^/stats/fedora/(.*)$ /api/4/$1 break;
        proxy_pass $glances_fedora;
    }

    # SenyaTasks widget: same-origin proxy so the dashboard can read the task
    # list under a tight CSP. Internal-only, like the rest.
    location /tasks/ {
        if ($internal_client = 0) { return 404; }
        set $senya_tasks "http://senya-tasks:8000";
        rewrite ^/tasks/(.*)$ /$1 break;
        proxy_pass $senya_tasks;
    }

    # SenyaDaily widget: same-origin proxy to the daily-notes app so the landing
    # page can read today's note/trackers under a tight CSP. Internal-only.
    location /daily/ {
        if ($internal_client = 0) { return 404; }
        set $senya_daily "http://senya-daily:8001";
        rewrite ^/daily/(.*)$ /$1 break;
        proxy_pass $senya_daily;
    }

    # Market map widget: finviz serves the S&P 500 performance numbers as JSON but
    # sends no CORS headers, so the page can't read it directly under
    # `connect-src 'self'`. Proxy just that one endpoint — a fixed upstream path,
    # not an open proxy — and cache it briefly so a dashboard left open (or a few
    # browsers on the LAN) doesn't hammer them. `st` is the period (d1/w1/w4/…);
    # the sector/market-cap structure is a static snapshot in /data/market-map.json.
    location = /market/perf {
        set $finviz "https://finviz.com";
        proxy_pass $finviz/api/map_perf?t=sec&st=$arg_st;
        proxy_ssl_server_name on;
        proxy_set_header Host finviz.com;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; senya-landing/1.0)";
        proxy_set_header Accept "application/json";
        proxy_set_header Accept-Encoding "";
        proxy_cache market;
        proxy_cache_key "$arg_st";
        proxy_cache_valid 200 60s;
        add_header Cache-Control "max-age=60" always;
    }

    location / {
        try_files $uri $uri/ =404;
        autoindex off;
    }
}
