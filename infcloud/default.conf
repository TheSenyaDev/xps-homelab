server {
  listen 80;
  server_name _;
  root /usr/share/nginx/infcloud;
  index index.html;

  # InfCloud static app (same origin as the proxied DAV endpoints below).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy Baikal's DAV endpoints so the browser talks to InfCloud and
  # Baikal on ONE origin — that is what avoids CORS entirely. nginx forwards
  # arbitrary WebDAV methods (PROPFIND, REPORT, MKCALENDAR, PUT, ...) as-is, and
  # the Basic-auth Authorization header passes straight through to Baikal.
  location ~ ^/(dav|cal|card|caldav|carddav)\.php {
    proxy_pass http://baikal:80;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 0;        # don't cap calendar/contact payloads
    proxy_read_timeout   120s;
  }

  # Auto-discovery: clients probing /.well-known land on the unified DAV root.
  location = /.well-known/caldav  { return 301 /dav.php/; }
  location = /.well-known/carddav { return 301 /dav.php/; }
}
