<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SenyaScraper</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="bar">
    <span class="brand">SENYA/SCRAPER</span>
    <button type="button" id="open-settings" class="ghost gear" title="Settings">⚙</button>
    <form id="search-form" class="search">
      <input id="q" type="search" placeholder="what are you looking for?" autocomplete="off" />
      <select id="site" aria-label="Site"></select>
      <select id="category" aria-label="Category"></select>
      <select id="sort" aria-label="Sort">
        <option value="best">Best match</option>
        <option value="newest">Newest</option>
        <option value="price-asc">Price ↑</option>
        <option value="price-desc">Price ↓</option>
      </select>
      <select id="condition" aria-label="Condition">
        <option value="any">Any</option>
        <option value="new">New</option>
        <option value="used">Used</option>
      </select>
      <input id="min_price" class="num" type="number" min="0" step="1" placeholder="min" />
      <input id="max_price" class="num" type="number" min="0" step="1" placeholder="max" />
      <button type="submit" class="go">SEARCH</button>
      <button type="button" id="save" class="ghost" title="Save this search to track new listings and price drops">SAVE</button>
    </form>
    <!-- Filters only this site has, rendered from /api/sites. Empty for a site
         that declares none, so nothing here is eBay-specific. -->
    <div id="site-opts" class="site-opts"></div>
  </header>

  <main class="wrap">
    <aside class="side">
      <h2 class="head">SEARCHES <button id="new" class="add" type="button" title="New search">+ NEW</button></h2>
      <ul id="saved" class="saved"></ul>
      <p class="hint">A saved search remembers every listing it has seen, so
        re-running one tells you what is <b>new</b> and what <b>dropped</b> in price.
        Click one to run it, <b>✎</b> to edit.</p>
    </aside>

    <section class="results">
      <div class="results-bar">
        <div id="status" class="status"></div>
        <!-- Only meaningful once a run has hidden something, so it stays hidden
             until then rather than sitting there greyed out. -->
        <label id="show-blocked-wrap" class="toggle" hidden>
          <input type="checkbox" id="show-blocked" />
          <span>Show blocked <span id="blocked-count" class="k"></span></span>
        </label>
      </div>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <!-- Create/edit a saved search. One form for both: `editing` in app.js decides
       whether SAVE posts a new profile or patches an existing one. -->
  <dialog id="dlg" class="dlg">
    <form id="dlg-form" method="dialog">
      <h2 id="dlg-title" class="head">NEW SEARCH</h2>

      <label>Name<span class="sub">what to call it</span>
        <input id="f-name" type="text" placeholder="Dell XPS" />
      </label>
      <label>Search for<span class="sub">required</span>
        <input id="f-query" type="text" placeholder="dell xps 13" required />
      </label>
      <!-- Several marketplaces at once. Each keeps its own options below, and a
           site that fails is reported without costing you the others. -->
      <fieldset class="opts sites-pick">
        <legend>Markets</legend>
        <div id="f-sites"></div>
      </fieldset>
      <label id="f-category-row">Category
        <select id="f-category"></select>
      </label>
      <div class="pair">
        <label>Condition
          <select id="f-condition">
            <option value="any">Any</option>
            <option value="new">New</option>
            <option value="used">Used</option>
          </select>
        </label>
        <label>Sort
          <select id="f-sort">
            <option value="best">Best match</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price ↑</option>
            <option value="price-desc">Price ↓</option>
          </select>
        </label>
      </div>
      <div class="pair">
        <label>Min price<input id="f-min" type="number" min="0" step="1" placeholder="any" /></label>
        <label>Max price<input id="f-max" type="number" min="0" step="1" placeholder="any" /></label>
      </div>
      <!-- Site-specific filters for the selected site, built from its declared
           options. Each site's values are stored separately, so switching the
           Site dropdown swaps these without losing the other site's settings. -->
      <fieldset id="f-opts-wrap" class="opts">
        <legend id="f-opts-legend">Site options</legend>
        <div id="f-opts"></div>
      </fieldset>

      <!-- One box per market: seller identities are not shared between them,
           so a single list could not say which site a name belongs to. -->
      <fieldset id="f-blocked-wrap" class="opts">
        <legend>Blocked sellers</legend>
        <div id="f-blocked"></div>
      </fieldset>

      <label class="check">
        <input id="f-notify" type="checkbox" checked />
        Notify on new listings and price drops
      </label>

      <p id="dlg-err" class="dlg-err" hidden></p>
      <menu class="dlg-actions">
        <button type="button" id="dlg-cancel" class="ghost">CANCEL</button>
        <button type="submit" id="dlg-save" class="go">SAVE</button>
      </menu>
    </form>
  </dialog>

  <!-- Item panel: everything the search returned, plus an on-demand fetch of
       the listing's own page for the description. -->
  <dialog id="item-dlg" class="dlg dlg-wide item-dlg">
    <div class="item-head">
      <h2 id="item-title" class="item-title"></h2>
      <button type="button" id="item-close" class="icon-x" aria-label="Close">✕</button>
    </div>
    <div class="item-body">
      <div class="item-media">
        <img id="item-img" alt="" />
        <div id="item-thumbs" class="item-thumbs"></div>
      </div>
      <div class="item-info">
        <div id="item-price" class="item-price"></div>
        <div id="item-chips" class="row"></div>
        <dl id="item-facts" class="facts"></dl>
        <div id="item-desc-wrap" class="item-desc" hidden>
          <h3 class="head">DESCRIPTION</h3>
          <p id="item-desc"></p>
        </div>
        <p id="item-detail-msg" class="dlg-note"></p>
      </div>
    </div>
    <menu class="dlg-actions item-actions">
      <button type="button" id="item-block" class="ghost danger"></button>
      <button type="button" id="item-detail" class="ghost">LOAD FULL DETAILS</button>
      <a id="item-open" class="go" target="_blank" rel="noopener noreferrer">OPEN ON SITE ↗</a>
    </menu>
  </dialog>

  <!-- Settings. Every control is rendered from /api/settings' schema, so adding
       a setting server-side needs no change here. -->
  <dialog id="settings-dlg" class="dlg dlg-wide">
    <form id="settings-form" method="dialog">
      <h2 class="head">SETTINGS</h2>
      <p class="dlg-note" id="settings-status"></p>
      <div id="settings-body"></div>
      <p id="settings-err" class="dlg-err" hidden></p>
      <menu class="dlg-actions">
        <button type="button" id="settings-close" class="ghost">CLOSE</button>
        <button type="submit" class="go">SAVE</button>
      </menu>
    </form>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
